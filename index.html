<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم نقل اللعبة - 4Fun</title>
  <!-- إعادة توجيه تلقائي للرابط الجديد بعد 5 ثواني -->
  <meta http-equiv="refresh" content="5;url=https://heka7.github.io/4fun">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080d1a;
      --surface: #131e35;
      --text: #e8eeff;
      --muted: #7a90bb;
      --gold: #f5b800;
      --gold2: #ff9500;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 0%, #1a2d55 0%, var(--bg) 70%);
    }
    .container {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(245, 184, 0, 0.15);
      max-width: 90%;
      width: 450px;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .icon {
      font-size: 5rem;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 15px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: var(--muted);
      font-size: 1.1rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
      color: #1a0800;
      padding: 16px 30px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 1.15rem;
      transition: all 0.2s;
      box-shadow: 0 6px 20px rgba(245, 184, 0, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 184, 0, 0.6);
    }
    .btn:active {
      transform: scale(0.97);
    }
    .loader {
      margin-top: 25px;
      font-size: 0.95rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚀</div>
    <h1>تم تحديث اللعبة!</h1>
    <p>أنت تستخدم رابطاً لإصدار قديم من اللعبة.<br>لقد قمنا بالانتقال إلى رابط جديد لتقديم تجربة أسرع وأفضل.</p>
    <a href="https://heka7.github.io/4fun" class="btn">
      <span>انتقل للرابط الجديد</span>
      <span>←</span>
    </a>
    <div class="loader">سيتم نقلك تلقائياً بعد ثوانٍ...</div>
  </div>
</body>
</html>
